<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

// ── CONFIG ──
const ADMIN={login:"admin",password:"AMAMERE"};
const WA_NUM="+2250789354646";
const WAVE_LINK="https://pay.wave.com/m/M_ci_vdUMet4tLQyX/c/ci/";
const ORANGE_LINK="https://multi.app.orange-money.com/app/v1/kapptivate/qrcode/odyssee/?id=codgen101-ee083900c69b44f89f4f82d7a1594dad&v=1";
const STORE_KEY="hdm-presences-historique";

// ── FIREBASE HELPERS ──
function getDB(){return window._db;}
function getFns(){return window._fbFns;}

async function waitFirebase(){
  if(window._fbReady) return;
  return new Promise(r=>window.addEventListener("firebase-ready",r,{once:true}));
}

async function prochaineLicence(){
  await waitFirebase();
  const {collection,getDocs,orderBy,query}=getFns();
  const db=getDB();
  const q=query(collection(db,"users"));
  const snap=await getDocs(q);
  if(snap.empty) return "HDM-000001";
  let max=0;
  snap.forEach(d=>{
    const lic=d.data().licence||"HDM-000000";
    const n=parseInt(lic.replace("HDM-",""))||0;
    if(n>max) max=n;
  });
  return "HDM-"+String(max+1).padStart(6,"0");
}

async function findUser(login,password){
  await waitFirebase();
  const {collection,getDocs,query,where}=getFns();
  const db=getDB();
  const q=query(collection(db,"users"),where("login","==",login),where("password","==",password));
  const snap=await getDocs(q);
  if(snap.empty) return null;
  const d=snap.docs[0];
  return {id:d.id,...d.data()};
}

async function createUser(data){
  await waitFirebase();
  const {collection,addDoc}=getFns();
  const db=getDB();
  return addDoc(collection(db,"users"),{...data,createdAt:new Date().toISOString()});
}

async function getAllUsers(){
  await waitFirebase();
  const {collection,getDocs}=getFns();
  const db=getDB();
  const snap=await getDocs(collection(db,"users"));
  return snap.docs.map(d=>({id:d.id,...d.data()}));
}

async function updateUser(id,data){
  await waitFirebase();
  const {doc,updateDoc}=getFns();
  const db=getDB();
  return updateDoc(doc(db,"users",id),data);
}

async function deleteUser(id){
  await waitFirebase();
  const {doc,deleteDoc}=getFns();
  const db=getDB();
  return deleteDoc(doc(db,"users",id));
}

async function loginExists(login){
  await waitFirebase();
  const {collection,getDocs,query,where}=getFns();
  const db=getDB();
  const q=query(collection(db,"users"),where("login","==",login));
  const snap=await getDocs(q);
  return !snap.empty;
}

// ── UTILITAIRES ──
function calc(j,eff,abs){
  const dj=j*2,poss=eff*dj,presEff=poss-abs;
  const tf=poss>0?((presEff/poss)*100).toFixed(2):"0.00";
  const ta=(100-parseFloat(tf)).toFixed(2);
  return {dj,poss,presEff,tf,ta};
}
function loadHisto(){try{const r=localStorage.getItem(STORE_KEY);return r?JSON.parse(r):[];}catch{return[];}}
function saveHisto(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d));}catch{}}

function Badge({statut}){
  const m={actif:["badge-actif","Actif"],attente:["badge-attente","En attente"],bloque:["badge-bloque","Bloqué"],refuse:["badge-bloque","Refusé"]};
  const s=m[statut]||m.attente;
  return <span className={`badge ${s[0]}`}>{s[1]}</span>;
}
function Jauge({val,type}){
  return <div className="jauge-bar"><div className={type==="green"?"jauge-green":"jauge-red"} style={{width:`${Math.min(parseFloat(val)||0,100)}%`}}/></div>;
}

// ── LOGIN ──
function Login({onLogin}){
  const [mode,setMode]=useState("login");
  const [form,setForm]=useState({nom:"",ecole:"",iepp:"",role:"instituteur",login:"",password:"",confirmPassword:""});
  const [err,setErr]=useState("");
  const [ok,setOk]=useState("");
  const [loading,setLoading]=useState(false);
  const [show,setShow]=useState(false);
  const [showOubli,setShowOubli]=useState(false);

  async function doLogin(){
    setErr("");setLoading(true);
    if(form.login===ADMIN.login&&form.password===ADMIN.password){
      const user={role:"admin",nom:"Administrateur",id:"admin",statut:"actif",licence:"HDM-ADMIN"};
      try{localStorage.setItem("hdm-session",JSON.stringify(user));}catch{}
      onLogin(user);setLoading(false);return;
    }
    try{
      const user=await findUser(form.login,form.password);
      setLoading(false);
      if(!user){setErr("Identifiant ou mot de passe incorrect.");return;}
      if(user.statut==="attente"){setErr("Compte en attente de validation par l'administrateur.");return;}
      if(user.statut==="bloque"){setErr("Compte bloqué. Contactez l'administrateur.");return;}
      if(user.statut==="refuse"){setErr("Demande refusée. Contactez l'administrateur.");return;}
      try{localStorage.setItem("hdm-session",JSON.stringify(user));}catch{}
      onLogin(user);
    }catch(e){setLoading(false);setErr("Erreur de connexion. Vérifiez votre internet.");}
  }

  async function doRegister(){
    setErr("");
    if(!form.nom||!form.login||!form.password||!form.ecole||!form.iepp){setErr("Tous les champs sont obligatoires.");return;}
    if(form.password.length<6){setErr("Le mot de passe doit contenir au moins 6 caractères.");return;}
    if(form.password!==form.confirmPassword){setErr("Les deux mots de passe ne correspondent pas.");return;}
    setLoading(true);
    try{
      const exists=await loginExists(form.login);
      if(exists){setErr("Cet identifiant est déjà utilisé.");setLoading(false);return;}
      const licence=await prochaineLicence();
      await createUser({licence,nom:form.nom,login:form.login,password:form.password,role:form.role,ecole:form.ecole,iepp:form.iepp,statut:"attente"});
      setLoading(false);
      setOk(`Compte créé ! Licence : ${licence}. En attente de validation.`);
      setForm({nom:"",ecole:"",iepp:"",role:"instituteur",login:"",password:"",confirmPassword:""});
      setTimeout(()=>{setOk("");setMode("login");},4000);
    }catch(e){setLoading(false);setErr("Erreur lors de la création. Vérifiez votre internet.");}
  }

  function contactWA(){
    const msg=encodeURIComponent("Bonjour Administrateur HDM CALCUL,\nJ'ai oublié mon mot de passe.\nMon identifiant : "+form.login+"\nMerci de réinitialiser mon compte.");
    window.open(`https://wa.me/${WA_NUM}?text=${msg}`,"_blank");
  }
  function contactSMS(){
    const msg=encodeURIComponent("Bonjour Admin HDM CALCUL, j'ai oublié mon mot de passe. Mon identifiant : "+form.login+". Merci.");
    window.open(`sms:${WA_NUM}?body=${msg}`,"_blank");
  }

  return (
    <div className="auth-wrap">
      <div className="auth-top">
        <div className="auth-flag">🇨🇮</div>
        <div className="auth-title">HDM CALCUL</div>
        <div className="auth-sub">Gestion de Présence · École Primaire · Côte d'Ivoire</div>
      </div>
      <div className="auth-card">
        <div className="tab-row">
          <button className={`tab-conn ${mode==="login"?"":"off"}`} onClick={()=>{setMode("login");setErr("");setShowOubli(false);}}>Connexion</button>
          <button className={`tab-insc ${mode==="register"?"":"off"}`} onClick={()=>{setMode("register");setErr("");setShowOubli(false);}}>Inscription</button>
        </div>

// ── SAISIE ──
function Saisie({user,onAjouter,roleLabel}){
  const [f,setF]=useState({periode:"",journees:"",fEff:"",fAbs:"",gEff:"",gAbs:""});
  const [showForm,setShowForm]=useState(false);
  const [saved,setSaved]=useState(false);

  const j=parseInt(f.journees)||0,fE=parseInt(f.fEff)||0,fA=parseInt(f.fAbs)||0,gE=parseInt(f.gEff)||0,gA=parseInt(f.gAbs)||0;
  const rF=calc(j,fE,fA),rG=calc(j,gE,gA),rT=calc(j,fE+gE,fA+gA);
  const showResult=j>0&&(fE>0||gE>0);

  function handleImprimer(){
    if(showResult&&f.periode){
      onAjouter({periode:f.periode,journees:j,fEffectif:fE,fAbsences:fA,gEffectif:gE,gAbsences:gA,rF,rG,rT});
      setSaved(true);setTimeout(()=>setSaved(false),2000);
    }
    window.print();
  }

  return (
    <div style={{paddingTop:"8px"}}>
      <div className="profil-mini">
        <div>
          <div className="profil-nom">{user.nom}</div>
          <div className="profil-info">🏫 {user.ecole||""}{user.iepp?` · 📍 ${user.iepp}`:""}</div>
          <div className="profil-info">{user.licence||""}</div>
        </div>
        <span className="badge-role">{roleLabel[user.role]||"👨‍🏫"}</span>
      </div>

      {saved&&<div className="alert-ok">✅ Enregistré dans l'historique !</div>}

      <div className="card">
        <div className="field-sm" style={{marginBottom:"12px"}}>
          <label>Période</label>
          <input placeholder="Ex : Novembre 2024" value={f.periode} onChange={e=>setF(p=>({...p,periode:e.target.value}))}/>
        </div>
        <div className="field-sm">
          <label>Journées ouvrables</label>
          <input type="number" min="0" placeholder="Ex : 22" value={f.journees} onChange={e=>setF(p=>({...p,journees:e.target.value}))}/>
          {j>0&&<div style={{fontSize:"12px",color:"#0B6E4F",marginTop:"4px",fontWeight:600}}>→ Demi-journées : <strong>{j*2}</strong></div>}
        </div>
      </div>

      <div className="card">
        <div style={{fontSize:"13px",fontWeight:700,color:"#EC4899",marginBottom:"10px"}}>👧 Filles</div>
        <div className="grid2">
          <div className="field-sm"><label>Effectif</label><input type="number" min="0" value={f.fEff} onChange={e=>setF(p=>({...p,fEff:e.target.value}))}/></div>
          <div className="field-sm"><label>Absences</label><input type="number" min="0" value={f.fAbs} onChange={e=>setF(p=>({...p,fAbs:e.target.value}))}/></div>
        </div>
      </div>

      <div className="card">
        <div style={{fontSize:"13px",fontWeight:700,color:"#3B82F6",marginBottom:"10px"}}>👦 Garçons</div>
        <div className="grid2">
          <div className="field-sm"><label>Effectif</label><input type="number" min="0" value={f.gEff} onChange={e=>setF(p=>({...p,gEff:e.target.value}))}/></div>
          <div className="field-sm"><label>Absences</label><input type="number" min="0" value={f.gAbs} onChange={e=>setF(p=>({...p,gAbs:e.target.value}))}/></div>
        </div>
      </div>

      {showResult&&<>
        <div className="section-card">
          <div style={{padding:"10px 14px 4px",background:"#F0FDF8"}}>
            <div style={{fontSize:"11px",fontWeight:700,color:"#0B6E4F",textTransform:"uppercase"}}>Tableau de Résultats</div>

                <tr key={lb}><td>{lb}</td><td className="pink">{a}</td><td className="blue-c">{b}</td><td className="green">{c}</td></tr>

        <div className="section-card">
          <button className="formule-toggle" onClick={()=>setShowForm(v=>!v)}>

            🖨️ Imprimer le rapport
          </button>
        </div>
      </>}
      {!showResult&&<div style={{height:"24px"}}/>}
      <div className="footer-copy">© 2025 DESMO IA — Tous droits réservés<br/>Développé en Côte d'Ivoire 🇨🇮</div>
    </div>
  );
}

function Historique({historique,setHistorique,userId}){
  function supprimer(id){
    const all=loadHisto().filter(h=>h.id!==id);
    saveHisto(all);
    setHistorique(all.filter(h=>h.userId===userId));
  }
  return (
    <div style={{paddingTop:"8px"}}>
      <div className="page-title">📂 Historique</div>
      {historique.length===0&&<div className="empty">Aucune saisie enregistrée.<br/><span style={{fontSize:"12px"}}>Fais un calcul et imprime pour l'enregistrer.</span></div>}
      {historique.map(s=>{
        const r=s.rT||calc(s.journees,s.fEffectif+s.gEffectif,s.fAbsences+s.gAbsences);
        const rF=s.rF||calc(s.journees,s.fEffectif,s.fAbsences);
        const rG=s.rG||calc(s.journees,s.gEffectif,s.gAbsences);
        return (
          <div key={s.id} className="hist-card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"10px"}}>
              <div>
                <div style={{fontSize:"15px",fontWeight:700,color:"#1C2B2A"}}>{s.periode}</div>
                <div style={{fontSize:"11px",color:"#94A3B8"}}>{s.date}</div>
              </div>
              <button onClick={()=>supprimer(s.id)} style={{background:"#FEF2F2",border:"1px solid #FECACA",color:"#DC2626",borderRadius:"8px",padding:"4px 8px",fontSize:"12px",cursor:"pointer"}}>🗑️</button>
            </div>
            <div style={{overflowX:"auto"}}>
              <table className="result-table">
                <thead><tr><th>Indicateur</th><th className="pink">Filles</th><th className="blue-c">Garçons</th><th className="green">Total</th></tr></thead>
                <tbody>
                  {[["Prés. Possible",rF.poss,rG.poss,r.poss],["Prés. Effective",rF.presEff,rG.presEff,r.presEff],["TF (%)",`${rF.tf}%`,`${rG.tf}%`,`${r.tf}%`],["TA (%)",`${rF.ta}%`,`${rG.ta}%`,`${r.ta}%`]].map(([lb,a,b,c])=>(
                    <tr key={lb}><td>{lb}</td><td className="pink">{a}</td><td className="blue-c">{b}</td><td className="green">{c}</td></tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{marginTop:"10px"}}>
              <div className="jauge-row"><span style={{fontSize:"12px",color:"#64748B"}}>TF Global</span><span style={{fontWeight:700,color:"#0B6E4F",fontSize:"12px"}}>{r.tf}%</span></div>
              <Jauge val={r.tf} type="green"/>
            </div>
          </div>
        );
      })}
      <div className="footer-copy">© 2025 DESMO IA — Tous droits réservés<br/>Développé en Côte d'Ivoire 🇨🇮</div>
    </div>
  );
}

function Profil({user,onLogout}){
  const [mode,setMode]=useState("profil");

  const [err,setErr]=useState("");
  const [ok,setOk]=useState("");
  const [loading,setLoading]=useState(false);

  async function changerMDP(){
    setErr("");
    if(!form.oldPwd||!form.newPwd||!form.confirmPwd){setErr("Tous les champs sont obligatoires.");return;}
    if(form.oldPwd!==user.password){setErr("Ancien mot de passe incorrect.");return;}
    if(form.newPwd.length<6){setErr("Le nouveau mot de passe doit contenir au moins 6 caractères.");return;}
    if(form.newPwd===form.oldPwd){setErr("Le nouveau mot de passe doit être différent de l'ancien.");return;}
    if(form.newPwd!==form.confirmPwd){setErr("Les deux nouveaux mots de passe ne correspondent pas.");return;}
    setLoading(true);
    try{
      await updateUser(user.id,{password:form.newPwd});
      try{localStorage.setItem("hdm-session",JSON.stringify({...user,password:form.newPwd}));}catch{}
      setLoading(false);
      setOk("✅ Mot de passe modifié avec succès !");
      setForm({oldPwd:"",newPwd:"",confirmPwd:""});
      setTimeout(()=>{setOk("");setMode("profil");},2500);

  async function action(id,statut){try{await updateUser(id,{statut});charger();}catch{}}
  async function changeRole(id,role){try{await updateUser(id,{role});charger();}catch{}}
  async function suppr(id){if(!confirm("Supprimer ce compte ?")) return;try{await deleteUser(id);charger();}catch{}}
  async function resetPwd(){
    if(!newPwd||newPwd.length<6){setMsg("Minimum 6 caractères.");return;}
    try{
      await updateUser(resetModal.id,{password:newPwd});
      setMsg("✅ Mot de passe réinitialisé !");
      setNewPwd("");
      setTimeout(()=>{setMsg("");setResetModal(null);},2000);
    }catch{setMsg("Erreur. Réessayez.");}
  }

  const filtered=users.filter(u=>{
    const matchF=filtre==="tous"||u.statut===filtre;
    const q=search.toLowerCase();
    const matchS=q===""||u.nom?.toLowerCase().includes(q)||u.ecole?.toLowerCase().includes(q)||u.iepp?.toLowerCase().includes(q)||u.licence?.toLowerCase().includes(q);
    return matchF&&matchS;
  });

  const stats={total:users.length,actifs:users.filter(u=>u.statut==="actif").length,attente:users.filter(u=>u.statut==="attente").length,bloques:users.filter(u=>u.statut==="bloque").length};

  return (
    <div className="app-wrap">
      {resetModal&&(
        <div className="modal-overlay">
          <div className="modal-card">
            <div className="modal-title">🔑 Réinitialiser le mot de passe</div>
            <p style={{fontSize:"13px",color:"#64748B",marginBottom:"14px"}}>Nouveau mot de passe pour <strong>{resetModal.nom}</strong></p>
            {msg&&<div className={msg.startsWith("✅")?"alert-ok":"alert-err"}>{msg}</div>}
            <input type="password" placeholder="Nouveau mot de passe (min. 6 caractères)" value={newPwd} onChange={e=>setNewPwd(e.target.value)}
              style={{width:"100%",border:"1.5px solid #E2E8F0",borderRadius:"10px",padding:"10px 12px",fontSize:"14px",outline:"none",marginBottom:"4px"}}/>
            <div className="modal-btns">
              <button className="btn-cancel" onClick={()=>{setResetModal(null);setNewPwd("");setMsg("");}}>Annuler</button>
              <button className="btn-confirm" onClick={resetPwd}>Confirmer</button>
            </div>
          </div>
        </div>
      )}
      <div className="header header-admin">
        <div>
          <div className="h-title">🛡️ HDM CALCUL · Admin</div>
          <div className="h-sub">Gestion de Présence</div>
        </div>
        <button className="btn-logout" onClick={onLogout}>Quitter</button>
      </div>
      <div style={{flex:1,overflowY:"auto"}}>
        <div className="main" style={{paddingTop:"16px"}}>
          {vue==="comptes"&&<>
            <div className="admin-stats">
              {[["Total",stats.total,"#0B6E4F"],["Actifs",stats.actifs,"#16A34A"],["Attente",stats.attente,"#CA8A04"],["Bloqués",stats.bloques,"#F77F00"]].map(([lb,v,c])=>(
                <div key={lb} className="admin-stat"><div className="admin-stat-num" style={{color:c}}>{v}</div><div className="admin-stat-label">{lb}</div></div>
              ))}
            </div>
            <input className="search-box" placeholder="🔍 Nom, école, IEPP ou licence..." value={search} onChange={e=>setSearch(e.target.value)}/>
            <div className="filter-row">
              {[["tous","Tous"],["attente","En attente"],["actif","Actifs"],["bloque","Bloqués"]].map(([v,lb])=>(
                <button key={v} className={`filter-btn ${filtre===v?"filter-on":"filter-off"}`} onClick={()=>setFiltre(v)}>{lb}</button>
              ))}
            </div>
            <div className="section-card">
              <div style={{padding:"12px 16px",borderBottom:"1px solid #F1F5F9",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontSize:"13px",fontWeight:700,color:"#374151"}}>Enseignants ({filtered.length})</div>
                <button onClick={charger} style={{background:"none",border:"none",cursor:"pointer",color:"#0B6E4F",fontSize:"18px"}}>🔄</button>
              </div>
              {loading&&<div className="loading">Chargement...</div>}
              {!loading&&filtered.length===0&&<div className="empty">Aucun résultat.</div>}
              {!loading&&filtered.map(u=>(
                <div key={u.id} className="user-card">
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div>
                      <div className="user-name">{u.nom}</div>
                      <div className="user-licence">{u.licence}</div>
                      <div className="user-meta">🏫 {u.ecole} · 📍 {u.iepp}</div>
                      <div className="user-meta">{u.role==="directeur"?"🏫 Directeur":"👨‍🏫 Instituteur"}</div>
                    </div>
                    <Badge statut={u.statut}/>
                  </div>
                  <div className="user-actions">
                    {u.statut==="attente"&&<>
                      <button className="abtn abtn-approve" onClick={()=>action(u.id,"actif")}>✅ Approuver</button>
                      <button className="abtn abtn-refuse" onClick={()=>action(u.id,"refuse")}>❌ Refuser</button>
                    </>}
                    {u.statut==="actif"&&<button className="abtn abtn-block" onClick={()=>action(u.id,"bloque")}>🚫 Bloquer</button>}
                    {u.statut==="bloque"&&<button className="abtn abtn-unblock" onClick={()=>action(u.id,"actif")}>🔓 Débloquer</button>}
                    <button className="abtn abtn-resetpwd" onClick={()=>setResetModal(u)}>🔑 Réinit. MDP</button>
                    <button className="abtn abtn-delete" onClick={()=>suppr(u.id)}>🗑️ Supprimer</button>
                    <select className="role-select" value={u.role} onChange={e=>changeRole(u.id,e.target.value)}>
                      <option value="instituteur">👨‍🏫 Instituteur</option>
                      <option value="directeur">🏫 Directeur</option>
                    </select>
                  </div>
                </div>
              ))}
            </div>
            <div className="footer-copy">© 2025 DESMO IA — Tous droits réservés<br/>Développé en Côte d'Ivoire 🇨🇮</div>
          </>}
          {vue==="calcul"&&<Saisie user={{nom:"Administrateur",ecole:"",iepp:"",role:"admin",licence:"HDM-ADMIN",password:"AMAMERE"}} onAjouter={()=>{}} roleLabel={{admin:"👑 Admin"}}/>}
        </div>
      </div>
      <div className="bottom-nav">
        {[["comptes","👑","Comptes"],["calcul","🧮","Calcul"]].map(([v,ic,lb])=>(
          <button key={v} className={`nav-btn ${vue===v?"on":"off"}`} onClick={()=>setVue(v)}>
            <span className="nav-icon">{ic}</span>{lb}
          </button>
        ))}
      </div>
    </div>
  );
}

// ── APP ──
function App(){
  const [session,setSession]=useState(null);
  const [checking,setChecking]=useState(true);

  useEffect(()=>{
    try{
      const saved=localStorage.getItem("hdm-session");
      if(saved) setSession(JSON.parse(saved));
    }catch{}
    setChecking(false);
  },[]);

  function handleLogin(user){setSession(user);}
  function handleLogout(){
    try{localStorage.removeItem("hdm-session");}catch{}
    setSession(null);
  }

  if(checking) return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"linear-gradient(160deg,#F77F00 0%,#fff 50%,#0B6E4F 100%)"}}>
      <div style={{fontSize:"40px",marginBottom:"12px"}}>🇨🇮</div>
      <div style={{fontSize:"22px",fontWeight:900,color:"#1C2B2A"}}>HDM CALCUL</div>
      <div style={{fontSize:"13px",color:"#555",marginTop:"4px"}}>Chargement...</div>
      <div style={{marginTop:"20px",width:"40px",height:"4px",background:"linear-gradient(90deg,#F77F00,#0B6E4F)",borderRadius:"99px"}}/>
    </div>
  );

  if(!session) return <Login onLogin={handleLogin}/>;
  if(session.role==="admin") return <Admin onLogout={handleLogout}/>;
  return <Dashboard user={session} onLogout={handleLogout}/>;
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
